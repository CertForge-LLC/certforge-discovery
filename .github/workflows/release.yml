name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build binaries
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64  go build -ldflags "-X main.Version=${{ github.ref_name }}" -o dist/certforge-discovery-linux-amd64      ./cmd/certforge-discovery
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64  go build -ldflags "-X main.Version=${{ github.ref_name }}" -o dist/certforge-discovery-linux-arm64      ./cmd/certforge-discovery
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64  go build -ldflags "-X main.Version=${{ github.ref_name }}" -o dist/certforge-discovery-darwin-amd64     ./cmd/certforge-discovery
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64  go build -ldflags "-X main.Version=${{ github.ref_name }}" -o dist/certforge-discovery-darwin-arm64     ./cmd/certforge-discovery
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64  go build -ldflags "-X main.Version=${{ github.ref_name }}" -o dist/certforge-discovery-windows-amd64.exe ./cmd/certforge-discovery

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
